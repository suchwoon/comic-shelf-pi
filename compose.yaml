services:
  comic-shelf:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BOOKS_PASSWORD: ${BOOKS_PASSWORD:?Set BOOKS_PASSWORD before starting Docker}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-256}
    volumes:
      - books:/app/data
    restart: unless-stopped
volumes:
  books:
